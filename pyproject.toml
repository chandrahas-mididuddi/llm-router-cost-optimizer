[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-cost-optimizer"
version = "0.1.0"
description = "Route each prompt to the cheapest LLM that can handle it, with semantic caching, fallbacks and cost tracking."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "scikit-learn==1.6.0",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
